services:
  postgres:
    image: postgres:17-alpine
    container_name: attest_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: attest_qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  engine:
    build: ./engine
    volumes:
      - ./engine/app:/code/app
      - ./data/corpus:/code/data/corpus:ro
      - ./data/figures:/code/data/figures
      - ./data/quota:/code/data/quota
      - hf_cache:/root/.cache/huggingface
    container_name: attest_engine
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENGINE_URL=http://engine:8000
      - TOKEN_SIGNING_SECRET=${TOKEN_SIGNING_SECRET}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  shell:
    build: ./shell
    container_name: attest_shell
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - TOKEN_SIGNING_SECRET=${TOKEN_SIGNING_SECRET}
      - ENGINE_URL=http://engine:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shell:/code

  eval:
    build:
      context: ./engine
      dockerfile: Dockerfile.eval
    container_name: attest_eval
    profiles: ["eval"]
    volumes:
      - ./engine/app:/code/app
      - ./data/eval:/code/data/eval
      - ./data/quota:/code/data/quota:ro
      - hf_cache:/root/.cache/huggingface
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JUDGE_API_KEY=${JUDGE_API_KEY}
      - ENGINE_URL=http://engine:8000
    depends_on:
      - engine

volumes:
  postgres_data:
  qdrant_data:
  hf_cache: