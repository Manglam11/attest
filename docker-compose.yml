services:
  postgres:
    image: postgres:17-alpine
    container_name: attest_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: attest_qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  engine:
    build: ./engine
    volumes:
      - ./engine/app:/code/app
      - ./data/corpus:/code/data/corpus:ro
    container_name: attest_engine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  shell:
    build: ./shell
    container_name: attest_shell
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shell:/code

volumes:
  postgres_data:
  qdrant_data: