{% extends "base.html" %}

{% block title %}Ask — Attest{% endblock %}

{% block content %}
<h1>Ask your documents</h1>

<form method="post" class="stacked" data-waits-on-engine>
  {% csrf_token %}
  <p>
    <label for="question">Question</label>
    <textarea id="question" name="question" rows="3" required>{{ question|default:"" }}</textarea>
  </p>
  <button type="submit">Ask</button>
  <div class="waiting">Asking the engine — this can take up to 3 minutes…</div>
</form>

{% if error or result %}
{% include "accounts/_result.html" %}
{% endif %}
{% endblock %}
