<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Attest{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f7; color: #1a1a1a; }
  header.topbar {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.75rem 1.5rem; background: #1a1a1a; color: #fff;
  }
  header.topbar .brand { color: #fff; font-weight: 600; text-decoration: none; }
  header.topbar .spacer { flex: 1; }
  header.topbar a { color: #ddd; text-decoration: none; }
  header.topbar form { display: inline; }
  header.topbar button {
    background: none; border: 1px solid #666; color: #ddd;
    padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer;
  }
  main { max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; }
  form.stacked p { display: flex; flex-direction: column; gap: 0.25rem; }
  input, textarea { padding: 0.5rem; font-size: 1rem; }
  button[type="submit"] {
    padding: 0.6rem 1.2rem; font-size: 1rem; background: #1a1a1a; color: #fff;
    border: none; border-radius: 4px; cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
  .waiting { display: none; margin-top: 1rem; color: #555; }
  .card {
    border: 1px solid #ddd; background: #fff; border-radius: 6px;
    padding: 1rem 1.25rem; margin-top: 1.5rem;
  }
  .card.error { border-color: #c0392b; background: #fdecea; }
  .card.refusal { border-color: #2c6fbb; background: #eaf2fb; }
  .trace { font-size: 0.9rem; color: #444; }
  .trace code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 3px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; }
  .source-card { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #eee; }
  .source-card:first-of-type { margin-top: 0.5rem; border-top: none; padding-top: 0; }
  .source-meta { font-size: 0.85rem; color: #555; margin: 0 0 0.35rem; }
  .history-list { list-style: none; padding: 0; }
  .history-list li a {
    display: block; padding: 0.9rem 1.1rem; margin-top: 0.75rem;
    border: 1px solid #ddd; border-radius: 6px; background: #fff;
    text-decoration: none; color: inherit;
  }
  .history-list li a:hover { border-color: #999; }
  .history-question { display: block; font-weight: 600; }
  .history-meta { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: #666; }
  .tile-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
  .tile {
    flex: 1 1 150px; border: 1px solid #ddd; border-radius: 6px;
    padding: 0.9rem 1rem; background: #fff;
  }
  .tile-pass { border-color: #2e7d32; background: #eef7ee; }
  .tile-fail { border-color: #c0392b; background: #fdecea; }
  .tile-label { font-size: 0.8rem; color: #555; }
  .tile-value { font-size: 1.6rem; font-weight: 700; margin-top: 0.15rem; }
  .tile-target { font-size: 0.78rem; color: #666; margin-top: 0.2rem; }
  .tile-verdict { font-size: 0.78rem; font-weight: 700; margin-top: 0.3rem; }
  .tile-pass .tile-verdict { color: #2e7d32; }
  .tile-fail .tile-verdict { color: #c0392b; }
  .tile-note { font-size: 0.72rem; color: #777; margin-top: 0.2rem; }
  .gold-table-wrap { overflow-x: auto; margin-top: 0.75rem; }
  .gold-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  .gold-table th, .gold-table td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #eee; }
  .gold-row-red { background: #fdecea; }
  .red-row-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 700; color: #c0392b;
    border: 1px solid #c0392b; border-radius: 3px; padding: 0.05rem 0.35rem; margin-left: 0.4rem;
  }
  .library-list { list-style: none; padding: 0; }
  .library-item {
    border: 1px solid #ddd; border-radius: 6px; background: #fff;
    padding: 0.9rem 1.1rem; margin-top: 0.75rem;
  }
  .library-item-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .library-name { font-weight: 600; }
  .status-badge {
    font-size: 0.72rem; font-weight: 700; border-radius: 3px; padding: 0.1rem 0.5rem;
    white-space: nowrap;
  }
  .status-ready { background: #eef7ee; color: #2e7d32; border: 1px solid #2e7d32; }
  .status-failed { background: #fdecea; color: #c0392b; border: 1px solid #c0392b; }
  .status-pending, .status-processing { background: #f0f0f0; color: #555; border: 1px solid #999; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'home' %}">Attest</a>
  {% if user.is_authenticated %}
    <a href="{% url 'ask' %}">Ask</a>
    <a href="{% url 'history' %}">History</a>
    <a href="{% url 'trust' %}">Trust</a>
    <a href="{% url 'library' %}">Library</a>
    <span class="spacer"></span>
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <span class="spacer"></span>
    <a href="{% url 'login' %}">Log in</a>
    <a href="{% url 'signup' %}">Sign up</a>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script>
  document.querySelectorAll("form[data-waits-on-engine]").forEach(function (form) {
    form.addEventListener("submit", function () {
      var button = form.querySelector("button[type=submit]");
      var waiting = form.querySelector(".waiting");
      if (button) button.disabled = true;
      if (waiting) waiting.style.display = "block";
    });
  });
</script>
</body>
</html>
